server:
  port: ${SERVER_PORT:8123}
  servlet:
    session:
      cookie:
        name: TEACUP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: teacup-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/teacup_picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

teacup:
  storage:
    local-root: ${PICTURE_LOCAL_ROOT:./data/pictures}
    public-base-url: ${PICTURE_PUBLIC_BASE_URL:http://127.0.0.1:8123/api/v1/public/assets}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:}

cos:
  client:
    host: ${COS_HOST:https://example.cos.ap-guangzhou.myqcloud.com}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:example-bucket}

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.teacup.teacuppicturebackend.controller
