server:
  port: ${SERVER_PORT:8123}

spring:
  application:
    name: teacup-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/teacup_picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

aliYunAi:
  apiKey: ${ALIYUN_AI_API_KEY:}

cos:
  client:
    host: ${COS_HOST:https://example.cos.ap-guangzhou.myqcloud.com}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-guangzhou}
    bucket: ${COS_BUCKET:example-bucket}

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.teacup.teacuppicturebackend.controller
