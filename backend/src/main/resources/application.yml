server:
  port: ${SERVER_PORT:8123}
  servlet:
    session:
      cookie:
        name: TEACUP_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: teacup-picture-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/teacup_picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
  redis:
    database: ${REDIS_DATABASE:0}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:5000}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:${RABBITMQ_HOST_PORT:5672}}
    username: ${RABBITMQ_USERNAME:teacup}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/teacup-picture}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  profiles:
    active: local

logging:
  level:
    root: info
    # MyBatis SQL 默认静默，避免逐条刷屏；排查 SQL 时把该包临时改为 debug 即可恢复
    com.teacup.teacuppicturebackend.mapper: warn


teacup:
  ai:
    quota:
      generate-daily: ${AI_GENERATE_DAILY_QUOTA:100}
      outpaint-daily: ${AI_OUTPAINT_DAILY_QUOTA:100}
      zone: ${AI_QUOTA_ZONE:Asia/Shanghai}
      # 配额对账兜底：修复事件路径没走完留下的预占悬挂。min-age 必须大于任务最长合法生命周期。
      reconcile-millis: ${AI_QUOTA_RECONCILE_MILLIS:600000}
      reconcile-initial-delay-millis: ${AI_QUOTA_RECONCILE_INITIAL_DELAY_MILLIS:60000}
      reconcile-min-age-minutes: ${AI_QUOTA_RECONCILE_MIN_AGE_MINUTES:360}
      reconcile-zombie-age-minutes: ${AI_QUOTA_RECONCILE_ZOMBIE_AGE_MINUTES:120}
      reconcile-batch-size: ${AI_QUOTA_RECONCILE_BATCH_SIZE:200}
    running-timeout-minutes: ${AI_RUNNING_TIMEOUT_MINUTES:15}
    worker:
      concurrency: ${AI_WORKER_CONCURRENCY:4}
      global-concurrency: ${AI_PROVIDER_GLOBAL_CONCURRENCY:12}
      requests-per-minute: ${AI_PROVIDER_REQUESTS_PER_MINUTE:60}
      burst-capacity: ${AI_PROVIDER_BURST_CAPACITY:4}
      lease-seconds: ${AI_WORKER_LEASE_SECONDS:300}
      # 必须满足 lease-renew-millis * 3 <= lease-seconds * 1000，否则启动即失败
      lease-renew-millis: ${AI_WORKER_LEASE_RENEW_MILLIS:90000}
      max-attempts: ${AI_WORKER_MAX_ATTEMPTS:4}
      shutdown-await-seconds: ${AI_WORKER_SHUTDOWN_AWAIT_SECONDS:180}
      publish-confirm-timeout-seconds: ${AI_PUBLISH_CONFIRM_TIMEOUT_SECONDS:5}
      outbox-retention-days: ${AI_OUTBOX_RETENTION_DAYS:7}
    openai:
      base-url: ${OPENAI_API_BASE_URL:https://claudenb.com}
      api-key: ${OPENAI_API_KEY:}
      timeout-ms: ${OPENAI_IMAGE_TIMEOUT_MS:120000}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:19000}
    access-key: ${MINIO_APP_ACCESS_KEY:teacup-picture-app}
    secret-key: ${MINIO_APP_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:teacup-pictures}
    public-base-url: ${PICTURE_PUBLIC_BASE_URL:http://127.0.0.1:8123/api/v1}
    legacy-local-root: ${PICTURE_LEGACY_LOCAL_ROOT:./data/pictures}
    legacy-public-base-url: ${PICTURE_LEGACY_PUBLIC_BASE_URL:http://127.0.0.1:8123/api/v1/public/assets}
    migration:
      enabled: ${TEACUP_STORAGE_MIGRATION_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # SQL 日志走 SLF4J，由上方 logging.level 统一控制
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.teacup.teacuppicturebackend.controller
